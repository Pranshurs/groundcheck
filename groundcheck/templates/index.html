<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GroundCheck — hallucination / grounding detector</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --line: #2a2f3a;
    --text: #e6e9ef; --muted: #99a1b3; --accent: #5b8cff;
    --good: #2ecc71; --bad: #ff5c5c; --warn: #f5a623;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 32px 20px 64px; }
  header h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--muted); }
  .badge { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted); margin-left: 8px; vertical-align: middle; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 18px; margin-top: 20px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 6px; }
  textarea, input[type=text] { width: 100%; background: var(--panel2); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 14px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; resize: vertical; }
  textarea { min-height: 92px; }
  .row { display: flex; gap: 12px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
  button { background: var(--accent); color: white; border: 0; border-radius: 8px;
    padding: 10px 18px; font-size: 15px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  .ghost { background: transparent; border: 1px solid var(--line); color: var(--muted); font-weight: 500; }
  .result { display: none; }
  .verdict { font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .meter { height: 10px; background: var(--panel2); border-radius: 999px; overflow: hidden; margin: 12px 0 6px; }
  .meter > div { height: 100%; width: 0; transition: width .4s ease; }
  .stats { display: flex; gap: 22px; color: var(--muted); font-size: 13px; margin-top: 10px; flex-wrap: wrap; }
  .stats b { color: var(--text); font-weight: 600; }
  .err { color: var(--bad); margin-top: 12px; font-size: 14px; }
  a { color: var(--accent); text-decoration: none; }
  footer { margin-top: 28px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>GroundCheck <span class="badge" id="backend-badge">loading…</span></h1>
    <p>Paste a source and an AI answer. It says whether the answer is <b>grounded</b> in the source — with a confidence score.</p>
  </header>

  <div class="card">
    <label for="question">Question <span style="opacity:.6">(optional)</span></label>
    <input type="text" id="question" placeholder="What does the source say about…?" />

    <label for="source">Source / context</label>
    <textarea id="source" placeholder="The passage the answer was supposed to be based on…"></textarea>

    <label for="answer">Answer to check</label>
    <textarea id="answer" placeholder="The AI-generated answer…"></textarea>

    <div class="row">
      <button id="run">Check grounding</button>
      <button class="ghost" id="ex-good">Load grounded example</button>
      <button class="ghost" id="ex-bad">Load hallucinated example</button>
    </div>

    <div class="result card" id="result" style="background:var(--panel2);">
      <div class="verdict"><span class="dot" id="dot"></span><span id="verdict-text"></span></div>
      <div class="meter"><div id="bar"></div></div>
      <div class="stats">
        <span>grounded score: <b id="gscore"></b></span>
        <span>hallucination risk: <b id="hscore"></b></span>
        <span>latency: <b id="lat"></b></span>
        <span>backend: <b id="bk"></b></span>
      </div>
    </div>
    <div class="err" id="err"></div>
  </div>

  <footer>
    API: <code>POST /api/check</code> with <code>{source, answer, question?}</code>.
    A small fine-tuned encoder — <a href="https://github.com/Pranshurs/groundcheck">source on GitHub</a>.
  </footer>
</div>

<script>
const $ = (id) => document.getElementById(id);

async function loadHealth() {
  try {
    const h = await (await fetch("/api/health")).json();
    $("backend-badge").textContent = h.backend === "model" ? "fine-tuned model" : "heuristic fallback";
  } catch { $("backend-badge").textContent = "offline"; }
}

function show(res) {
  $("err").textContent = "";
  $("result").style.display = "block";
  const grounded = res.grounded;
  const g = res.grounded_score, hPct = Math.round(res.hallucination_score * 100), gPct = Math.round(g * 100);
  $("verdict-text").textContent = grounded ? "Grounded" : "Hallucinated";
  $("dot").style.background = grounded ? "var(--good)" : "var(--bad)";
  $("bar").style.width = gPct + "%";
  $("bar").style.background = grounded ? "var(--good)" : "var(--bad)";
  $("gscore").textContent = g.toFixed(3);
  $("hscore").textContent = hPct + "%";
  $("lat").textContent = res.latency_ms.toFixed(1) + " ms";
  $("bk").textContent = res.backend;
}

async function run() {
  const source = $("source").value.trim(), answer = $("answer").value.trim();
  if (!source || !answer) { $("err").textContent = "Fill in both source and answer."; return; }
  $("run").disabled = true; $("err").textContent = "";
  try {
    const r = await fetch("/api/check", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ source, answer, question: $("question").value.trim() || null }),
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    show(await r.json());
  } catch (e) { $("err").textContent = "Request failed: " + e.message; }
  finally { $("run").disabled = false; }
}

$("run").onclick = run;
$("ex-good").onclick = () => {
  $("question").value = "What is the capital of France?";
  $("source").value = "France is a country in Western Europe. Its capital and largest city is Paris.";
  $("answer").value = "Paris is the capital of France.";
};
$("ex-bad").onclick = () => {
  $("question").value = "How are quartiles defined?";
  $("source").value = "Q3, the upper quartile, splits the lowest 75% (or highest 25%) of the data.";
  $("answer").value = "The third quartile (Q3) splits the highest 75% of the data.";
};
loadHealth();
</script>
</body>
</html>
