name: tests

# Unit tier: no torch, no weights. Proves the package, CLI, API contract and the
# backend policy (no silent fallback) on the oldest and newest supported Pythons.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check --select E,F,W,B --ignore E501 groundcheck eval training bench tests run.py
      - name: Unit tests
        run: pytest -q
      - name: Build and install the wheel in a clean venv
        run: |
          python -m build --wheel
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install "$(ls dist/*.whl)[serve]"
          cd /tmp
          /tmp/wheel-env/bin/python -c "import groundcheck.api, importlib.resources as r; assert r.files('groundcheck').joinpath('templates/index.html').is_file()"
          /tmp/wheel-env/bin/groundcheck --backend heuristic --source "Paris is the capital of France." --answer "Paris is the capital of France." --json
          # Without the [model] extra the default backend must refuse, not fall back.
          if /tmp/wheel-env/bin/groundcheck --source a --answer a; then echo "expected exit 2"; exit 1; fi
